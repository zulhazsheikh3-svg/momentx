<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MomentX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042); color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    h1 { margin-bottom: 20px; color: #a855f7; text-shadow: 0 0 10px rgba(168, 85, 247, 0.5); }
    
    /* Liquid Glass Theme Card */
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      margin-bottom: 20px;
    }
    
    input, textarea, button {
      width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; outline: none;
    }
    input, textarea {
      background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2);
    }
    input::placeholder, textarea::placeholder { color: #cbd5e1; }
    button {
      background: linear-gradient(90deg, #8b5cf6, #ec4899); color: white; font-weight: bold; cursor: pointer; transition: 0.3s;
    }
    button:hover { opacity: 0.9; transform: scale(1.02); }
    .btn-secondary { background: rgba(255,255,255,0.2); margin-top: 5px; }

    /* Post Feed Styles */
    .post-item {
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 15px; margin-top: 15px; word-break: break-word;
    }
    .post-user { font-size: 0.85rem; color: #c084fc; font-weight: bold; }
    .post-time { font-size: 0.7rem; color: #94a3b8; margin-bottom: 8px; }
    .post-content { font-size: 1rem; color: #f8fafc; }
  </style>
</head>
<body>

  <h1>MomentX</h1>

  <!-- Authentication Box (Signup/Login) -->
  <div id="auth-box" class="glass-card">
    <h2 style="text-align: center; margin-bottom: 10px;">লগইন / সাইনআপ</h2>
    <input type="email" id="email" placeholder="ইমেইল লিখুন (যেমন: name@gmail.com)">
    <input type="password" id="password" placeholder="পাসওয়ার্ড লিখুন">
    <button onclick="login()">Login</button>
    <button class="btn-secondary" onclick="signUp()">Create Account</button>
  </div>

  <!-- Post Creation Box -->
  <div id="post-box" class="glass-card" style="display: none;">
    <p>স্বাগতম, <span id="user-email" style="color: #a855f7;"></span></p>
    <textarea id="post-input" rows="3" placeholder="নতুন কিছু শেয়ার করুন..."></textarea>
    <button onclick="createPost()">Post</button>
    <button class="btn-secondary" onclick="logout()">Logout</button>
  </div>

  <!-- Feed Container -->
  <div style="width: 100%; max-width: 420px;">
    <h3 style="margin-top: 10px; color: #e2e8f0;">Recent Posts</h3>
    <div id="posts-container"></div>
  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Config Details (Updated)
    const firebaseConfig = {
      apiKey: "AIzaSyAM_3hf8tv2vYZRLyo7pEjjV5T_WiSaji0",
      authDomain: "momentx-b9ff7.firebaseapp.com",
      projectId: "momentx-b9ff7",
      storageBucket: "momentx-b9ff7.firebasestorage.app",
      messagingSenderId: "519993726054",
      appId: "1:519993726054:web:ae6838f83679b3c73789a7",
      measurementId: "G-06024PXW7Q"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Auth State Monitor
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('auth-box').style.display = 'none';
        document.getElementById('post-box').style.display = 'block';
        document.getElementById('user-email').innerText = user.email;
      } else {
        document.getElementById('auth-box').style.display = 'block';
        document.getElementById('post-box').style.display = 'none';
      }
    });

    // Sign Up
    window.signUp = async () => {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      if(!email || !pass) return alert("ইমেইল ও পাসওয়ার্ড দিন");
      try {
        await createUserWithEmailAndPassword(auth, email, pass);
        alert("অ্যাকাউন্ট সফলভাবে তৈরি হয়েছে!");
      } catch (e) { alert(e.message); }
    };

    // Log In
    window.login = async () => {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      if(!email || !pass) return alert("ইমেইল ও পাসওয়ার্ড দিন");
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (e) { alert(e.message); }
    };

    // Log Out
    window.logout = () => signOut(auth);

    // Create Post
    window.createPost = async () => {
      const text = document.getElementById('post-input').value;
      if(!text.trim()) return alert("কিছু লিখুন!");
      try {
        await addDoc(collection(db, "posts"), {
          content: text,
          user: auth.currentUser.email,
          createdAt: serverTimestamp()
        });
        document.getElementById('post-input').value = '';
      } catch (e) { alert(e.message); }
    };

    // Live Feed Listener
    const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      const postsContainer = document.getElementById('posts-container');
      postsContainer.innerHTML = '';
      snapshot.forEach((doc) => {
        const data = doc.data();
        const time = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleString() : 'Just now';
        postsContainer.innerHTML += `
          <div class="post-item">
            <div class="post-user">${data.user || 'User'}</div>
            <div class="post-time">${time}</div>
            <div class="post-content">${data.content}</div>
          </div>
        `;
      });
    });
  </script>
</body>
</html>
